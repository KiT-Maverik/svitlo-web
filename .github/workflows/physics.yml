name: Physics textbook checks

on:
  pull_request:
    paths:
      - 'learningApps/physics/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-workspaces.mjs'
      - 'scripts/check-package-boundaries.mjs'
      - 'scripts/check-extraction-readiness.mjs'
      - '.github/workflows/physics.yml'
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run packages:check
      - run: npm run typecheck:physics
      - run: npm run build:physics
