name: Questions quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run packages:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run test:db:coverage
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npx playwright install chromium
        if: ${{ !cancelled() }}
      - name: Lesson page E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/playground -- src/components/pages/Lesson/Lesson.e2e.spec.ts
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: questions-test-results
          path: apps/playground/test-results/
