name: Translation Review Artifacts

# Deliberately opt-in, reusable, and independent of FastGate.
# GitHub requires workflow_dispatch definitions to be present on the default branch.
on:
  # An owner can ask the connected GitHub agent to post a guarded command in a PR.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit to review (empty = selected workflow branch)'
        required: false
        type: string
        default: ''
      package:
        description: 'Textbook path, e.g. learningApps/astronomy (ignored when all_packages=true)'
        required: true
        type: string
        default: 'learningApps/astronomy'
      all_packages:
        description: 'Generate all available Code Skills taxonomies'
        required: true
        type: boolean
        default: false
      locale:
        description: 'Language key, e.g. qm (ignored when all_locales=true)'
        required: true
        type: string
        default: 'qm'
      all_locales:
        description: 'Generate every supported language from the live language registry'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  generate:
    name: Generate temporary localized Markdown views
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/review-translation '))
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Owner-only, explicit slash command; cannot be invoked by arbitrary PR commenters.
      # Always checks out the current head SHA of the PR containing the command.
      - name: Resolve PR comment scope
        id: comment_scope
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const tokens = event.comment.body.trim().split(/\s+/);
          if (tokens.shift() !== '/review-translation') throw new Error('Unknown command');
          const scope = { package: 'learningApps/astronomy', locale: 'qm', allPackages: false, allLocales: false };
          let explicitPackage = false;
          let explicitLocale = false;
          for (const token of tokens) {
            if (token === 'all-packages') scope.allPackages = true;
            else if (token === 'all-locales') scope.allLocales = true;
            else if (/^package=learningApps\/[a-z][a-z0-9-]*$/i.test(token)) {
              scope.package = token.slice('package='.length);
              explicitPackage = true;
            } else if (/^locale=[a-z][a-z-]*$/.test(token)) {
              scope.locale = token.slice('locale='.length);
              explicitLocale = true;
            } else throw new Error('Invalid /review-translation option: ' + token);
          }
          if (scope.allPackages && explicitPackage) throw new Error('Choose package=... OR all-packages');
          if (scope.allLocales && explicitLocale) throw new Error('Choose locale=... OR all-locales');
          const pr = event.issue.number;
          const response = await fetch('https://api.github.com/repos/' +
            process.env.GITHUB_REPOSITORY + '/pulls/' + pr, {
              headers: {
                authorization: 'Bearer ' + process.env.GH_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
            });
          if (!response.ok) throw new Error('Failed to resolve source PR: HTTP ' + response.status);
          const pull = await response.json();
          if (pull.head.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('Cross-repository PR head is not supported for unattended reviews');
          }
          const values = {
            source_ref: pull.head.sha,
            package: scope.package,
            all_packages: String(scope.allPackages),
            locale: scope.locale,
            all_locales: String(scope.allLocales),
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');
          NODE

      - name: Check out requested source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.comment_scope.outputs.source_ref || inputs.source_ref || github.ref_name }}
          persist-credentials: false

      # Install only the TypeScript parser used by the existing generator.
      # Do not install the monorepo or build any textbook application.
      - name: Install lightweight parser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/review-tools" --no-save --ignore-scripts --no-audit --no-fund 'typescript@5'
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/review-tools/node_modules/typescript" node_modules/typescript

      - name: Validate artifact generator syntax
        run: |
          node --check scripts/generate-translation-review-artifacts.mjs
          node --check scripts/generate-skills-taxonomy.mjs
          node scripts/generate-translation-review-artifacts.mjs --help > /dev/null

      - name: Generate requested review artifacts
        shell: bash
        env:
          REVIEW_PACKAGE: ${{ steps.comment_scope.outputs.package || inputs.package }}
          REVIEW_ALL_PACKAGES: ${{ steps.comment_scope.outputs.all_packages || inputs.all_packages }}
          REVIEW_LOCALE: ${{ steps.comment_scope.outputs.locale || inputs.locale }}
          REVIEW_ALL_LOCALES: ${{ steps.comment_scope.outputs.all_locales || inputs.all_locales }}
        run: |
          set -euo pipefail
          args=(--out-dir "$RUNNER_TEMP/translation-review")
          if [[ "$REVIEW_ALL_PACKAGES" == 'true' ]]; then
            args+=(--all-packages)
          else
            args+=(--package "$REVIEW_PACKAGE")
          fi
          if [[ "$REVIEW_ALL_LOCALES" == 'true' ]]; then
            args+=(--all-locales)
          else
            args+=(--locale "$REVIEW_LOCALE")
          fi
          node scripts/generate-translation-review-artifacts.mjs "${args[@]}"

      - name: Upload short-lived Markdown bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-review/
          retention-days: 1
          if-no-files-found: warn

      - name: Report review scope and artifact lifecycle
        if: always()
        shell: bash
        env:
          REVIEW_SOURCE_REF: ${{ steps.comment_scope.outputs.source_ref || inputs.source_ref || github.ref_name }}
        run: |
          {
            echo '### Translation review artifacts'
            echo "- Run: ${{ github.run_id }} / attempt ${{ github.run_attempt }}"
            echo "- Requested source: $REVIEW_SOURCE_REF"
            echo '- Generated Markdown exists only in this run artifact; no commit or source edits are made.'
            echo '- Uploaded archive expires automatically after **1 day**.'
            echo '- Runner temp files are removed by the final cleanup step.'
            if [[ -f "$RUNNER_TEMP/translation-review/manifest.json" ]]; then
              node -e 'const m=require(process.argv[1]); console.log("- Source commit: `"+(m.sourceCommit||"unknown")+"`"); console.log("- Generated: **"+m.generated.length+"**; failures: **"+m.failures.length+"**"); if(m.failures.length) console.log("- Failed scope(s): "+m.failures.map(x=>x.textbook+"/"+x.locale).join(", "));' "$RUNNER_TEMP/translation-review/manifest.json"
            else
              echo '- No manifest produced; inspect earlier job logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no source file changes
        if: always()
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Remove temporary runner files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/translation-review" "$RUNNER_TEMP/review-tools"
          rm -f -- node_modules/typescript
