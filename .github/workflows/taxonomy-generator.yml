name: Skills taxonomy generator quality
on:
  pull_request:
    paths:
      - 'scripts/generate-skills-taxonomy*'
      - 'scripts/implement-skills-taxonomy*'
      - 'learningApps/math/data/skills/**'
      - 'shared/contracts/src/types/languages.ts'
      - 'package.json'
      - '.github/workflows/taxonomy-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:taxonomy-generator
      - run: npm run test:taxonomy-codegen
