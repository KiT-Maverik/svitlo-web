name: Time taxonomy verification (temporary)
on:
  push:
    branches: [feat/skills-time]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and integration tests (includes taxonomy indexes)
        run: npm test
      - name: Component tests
        run: npm run test:components
      - name: ESLint
        run: npm run lint
      - name: Next.js build
        run: npm run build
