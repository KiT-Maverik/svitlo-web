name: Arithmetic taxonomy quality
on:
  pull_request:
    paths:
      - 'learningApps/math/src/math/skillsTaxonomy/arithmetic/**'
      - 'learningApps/math/src/math/skillsTaxonomy/UUID-MIGRATION.md'
      - 'learningApps/math/src/math/skills-inventory.md'
      - 'learningApps/math/src/utils/builders/config/arithmeticTaxonomy.spec.ts'
      - 'shared/engine/**'
      - '.github/workflows/arithmetic-taxonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
