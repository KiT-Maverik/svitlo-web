name: UI Kit Storybook

on:
  pull_request:
    paths:
      - 'shared/ui-kit/**'
      - 'shared/engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-kit-storybook.yml'
  push:
    branches: [main]
    paths:
      - 'shared/ui-kit/**'
      - 'shared/engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-kit-storybook.yml'

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
