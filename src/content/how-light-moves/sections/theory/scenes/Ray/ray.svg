<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Світловий промінь</title>
  <desc id="desc">Світло від ліхтарика ліворуч поширюється прямою лінією до екрана праворуч.</desc>
  <defs>
    <linearGradient id="beam"><stop stop-color="#ffd45b" stop-opacity=".6"/><stop offset="1" stop-color="#ffd45b" stop-opacity=".08"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#ffdc73" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="340" rx="24" fill="#101e35"/>
  <path d="M215 160 805 105 805 225 215 180Z" fill="url(#beam)"/>
  <rect x="95" y="141" width="100" height="58" rx="12" fill="#72859f"/>
  <path d="M185 141 220 123 220 217 185 199Z" fill="#cad6e5"/>
  <path d="M245 170H760" stroke="#ffdc73" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="800" y="75" width="14" height="190" rx="7" fill="#d5e4f4"/>
  <g fill="#d5e4f4" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="160" y="285">Джерело</text><text x="500" y="115">Напрямок поширення</text><text x="807" y="305">Екран</text>
  </g>
</svg>
